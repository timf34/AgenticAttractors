[project]
name = "agentic-attractors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "feedparser>=6.0.12",
    "jinja2>=3.1.6",
    "litellm>=1.91.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typer>=0.26.8",
]

[project.scripts]
attractors = "attractors.runner:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attractors"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
