# Phase-4 cost-calibration mini-pilot: 4 runs at reduced caps.
# Purpose: measure real $/run + per-provider tool-calling quality before
# committing to the 40-run pilot.
experiment: minipilot_v1
defaults:
  affordance: L2
  tool_menu: T1
  ping_variant: bare
  sessions: 1
  max_pings: 20
  max_tool_calls: 40
  max_sim_hours: 48
  budget_usd: 10
  image: attractors-sandbox:v2
  container_time: sim
  network: false
grid:
  model: [opus-4.8, gpt-5.5]
  seed: [0, 1]
